<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Книга рецептов{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="top">
  <a class="brand" href="{{ url_for('index') }}">Книга рецептов</a>
  <nav>
    <a href="{{ url_for('index') }}">Рецепты</a>
    <a href="{{ url_for('shopping') }}">Покупки</a>
    <a href="{{ url_for('export') }}">Резервная копия</a>
    <a class="btn" href="{{ url_for('random_recipe') }}">Случайный рецепт</a>
    <a class="btn" href="{{ url_for('new_recipe') }}">Добавить рецепт</a>
  </nav>
</header>
<main>
  {% for m in get_flashed_messages() %}<p class="flash">{{ m }}</p>{% endfor %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
